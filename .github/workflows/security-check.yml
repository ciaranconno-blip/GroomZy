name: Security and Fault Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Check for code faults and formatting errors (ESLint)
      - name: Run code fault check
        run: npm run lint

      # 5. Check for known vulnerabilities in dependencies
      - name: Run npm security audit
        run: npm audit --audit-level=high

      # 6. Scan repository files for malware — a real ClamAV scan, no
      # third-party action or token required (the marketplace "ClamAV"
      # actions commonly seen in templates are often actually Snyk in
      # disguise, gated behind a SNYK_TOKEN secret this repo doesn't have).
      #
      # Uses the official clamav/clamav Docker image instead of apt-get
      # install: apt's clamav package ships with NO virus database at all
      # (confirmed locally — clamscan fails immediately with "No supported
      # database files found") and is meant to fetch one via freshclam on
      # first run, which reliably hung/failed against ClamAV's public
      # mirror network from GitHub-hosted runners across three separate
      # attempts. The Docker image bakes a real database into the image
      # itself, so there's nothing to fetch at run time — scans exactly
      # the files git tracks, piped in via a bind-mounted workspace.
      #
      # continue-on-error: a scan-infrastructure hiccup here (image pull,
      # Docker Hub rate limit) is a different kind of problem than lint or
      # audit actually finding something wrong with the code — it shouldn't
      # block every push/PR the way those do. A failure still shows up
      # clearly in the Actions tab (⚠️ instead of ✅), just doesn't turn the
      # whole run red.
      - name: ClamAV virus scan
        timeout-minutes: 5
        continue-on-error: true
        run: |
          git ls-files > /tmp/tracked-files.txt
          docker run --rm \
            -v "${{ github.workspace }}:/scan:ro" \
            -v /tmp/tracked-files.txt:/tracked-files.txt:ro \
            clamav/clamav:stable \
            sh -c 'cd /scan && xargs -a /tracked-files.txt clamscan --infected --'
