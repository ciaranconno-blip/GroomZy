name: Security and Fault Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Check for code faults and formatting errors (ESLint)
      - name: Run code fault check
        run: npm run lint

      # 5. Check for known vulnerabilities in dependencies
      - name: Run npm security audit
        run: npm audit --audit-level=high

      # 6. Scan repository files for malware — a real ClamAV scan, no
      # third-party action or token required (the marketplace "ClamAV"
      # actions commonly seen in templates are often actually Snyk in
      # disguise, gated behind a SNYK_TOKEN secret this repo doesn't have).
      #
      # freshclam (the signature updater) talks to ClamAV's public mirror
      # network, which is notoriously slow/rate-limited from shared CI
      # runners and can hang well past any reasonable wait — bounded with
      # a shell-level timeout plus a step-level backstop so a slow mirror
      # degrades to "scan with the signatures apt just installed" instead
      # of blocking the whole workflow.
      #
      # Scans exactly the files git tracks (via `git ls-files`) rather than
      # the working directory with --exclude-dir patterns — clamscan's
      # exclude-dir regex is matched against however it internally
      # normalizes the path, which doesn't reliably match a literal `./`
      # prefix, so an excluded node_modules could still get pulled in.
      # git ls-files sidesteps that entirely: it can never list node_modules,
      # .git, or .next since none of that is tracked.
      - name: ClamAV virus scan
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clamav
          timeout 60 sudo freshclam --quiet || echo "freshclam unavailable/slow — scanning with bundled signatures"
          git ls-files -z | xargs -0 clamscan --infected --
