name: Security and Fault Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-scan:
    runs-on: ubuntu-latest

    steps:
    # 1. Get the code from the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Node.js environment (change version if needed)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # 3. Install your project dependencies
    - name: Install dependencies
      run: npm ci

    # 4. Check for code faults and formatting errors (Linter)
    - name: Run Code Fault Check
      run: npm run lint --if-present

    # 5. Check for known vulnerabilities in your packages
    - name: Run NPM Security Audit
      run: npm audit --audit-level=high

    # 6. Scan for viruses and malware
    - name: ClamAV Virus Scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: monitor

