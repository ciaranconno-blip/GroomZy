# Firebase App Hosting runtime config. Safe to commit — NEXT_PUBLIC_* Firebase
# values are meant to be public (real security is Firestore's rules, not
# hiding these), and actual secrets are referenced from Secret Manager below,
# never inlined here.
#
# No GOOGLE_APPLICATION_CREDENTIALS entry on purpose: Cloud Run provides the
# backend's own service account automatically, which is the whole reason this
# app is hosted here instead of somewhere that'd need a key file.

runConfig:
  minInstances: 0
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDjSP55Bq0EnjLVwMtarrIYU_dz2HtUhb0"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "groomzy-booking-app.firebaseapp.com"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "groomzy-booking-app"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "groomzy-booking-app.firebasestorage.app"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "782151265965"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:782151265965:web:cebdfa5b5b81ee14aa2024"
    availability: [BUILD, RUNTIME]

  - variable: GOOGLE_OAUTH_CLIENT_ID
    value: "140359900146-rhchrrh043mtqhv06t74t83vgf4tcoii.apps.googleusercontent.com"
    availability: [RUNTIME]

  - variable: GOOGLE_OAUTH_CLIENT_SECRET
    secret: google-oauth-client-secret
    availability: [RUNTIME]

  # TODO: update once we know the real production URL (custom domain or
  # the *.hosted.app one) — must exactly match an Authorized redirect URI
  # on the OAuth client in Google Cloud Console, or the Connect Calendar
  # button will fail with redirect_uri_mismatch.
  - variable: GOOGLE_OAUTH_REDIRECT_URI
    value: "https://groomzy--groomzy-booking-app.europe-west4.hosted.app/api/auth/google/callback"
    availability: [RUNTIME]

  # Resend — sends the "new groomer signed up" notification email.
  - variable: RESEND_API_KEY
    secret: resend-api-key
    availability: [RUNTIME]
